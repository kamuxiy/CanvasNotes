name: Sync package-lock

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-lockfile.yml'

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate package-lock.json for package.json version
        run: |
          set -euo pipefail
          node -e "const v=require('./package.json').version; if(v!=='1.3.0') { console.error('expected 1.3.0 got', v); process.exit(1) }"
          npm install --package-lock-only --ignore-scripts
          node -e "const v=require('./package-lock.json').version; if(v!=='1.3.0') process.exit(1); console.log('lock version', v)"
      - name: Commit lockfile and remove staging artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git rm -f scripts/package-lock.json.gz.b64.part* 2>/dev/null || true
          git rm -f scripts/package-lock.json.gz.hex.part* 2>/dev/null || true
          git rm -f .github/workflows/import-lockfile.yml 2>/dev/null || true
          git rm -f .github/workflows/sync-lockfile.yml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          git commit -m "chore: sync package-lock for 1.3.0"
          git push
