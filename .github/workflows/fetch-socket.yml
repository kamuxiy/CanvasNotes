name: fetch-socket
on:
  push:
    paths:
      - '.github/workflows/fetch-socket.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download socket-dialog.svg
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o docs/images/socket-dialog.svg PLACEHOLDER_URL
          expected=PLACEHOLDER_MD5
          actual=$(md5sum docs/images/socket-dialog.svg | awk '{print $1}')
          echo "md5 $actual"
          test "$actual" = "$expected"
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/socket-dialog.svg
          git diff --cached --quiet && exit 0
          git commit -m "Refresh docs/images/socket-dialog.svg from disk"
          git push
