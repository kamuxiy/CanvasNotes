name: assemble-duplicate
on:
  push:
    paths:
      - 'docs/images/_dup_b64/**'
      - '.github/workflows/assemble-duplicate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble duplicate.svg
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64, hashlib
          b64 = ''.join(Path(f'docs/images/_dup_b64/part_{i:02d}.b64').read_text().strip() for i in range(19))
          data = base64.b64decode(b64)
          expected = '40c533a009f6024dfe017427b6b027f0'
          actual = hashlib.md5(data).hexdigest()
          print('md5', actual, 'len', len(data))
          assert actual == expected
          Path('docs/images/duplicate.svg').write_bytes(data)
          PY
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/duplicate.svg
          git diff --cached --quiet && exit 0
          git commit -m "Assemble docs/images/duplicate.svg from b64 parts"
          git push
