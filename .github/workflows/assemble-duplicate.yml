name: assemble-duplicate
on:
  push:
    paths:
      - '.github/workflows/assemble-duplicate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify duplicate.svg
        run: |
          set -euo pipefail
          curl -fsSL -o docs/images/duplicate.svg https://litter.catbox.moe/mf8mj1.svg
          expected=40c533a009f6024dfe017427b6b027f0
          actual=$(md5sum docs/images/duplicate.svg | awk '{print $1}')
          echo "md5 $actual"
          test "$actual" = "$expected"
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/duplicate.svg
          git diff --cached --quiet && exit 0
          git commit -m "Add docs/images/duplicate.svg"
          git push
