name: assemble-duplicate
on:
  push:
    paths:
      - 'docs/images/_dup_parts/**'
      - '.github/workflows/assemble-duplicate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble duplicate.svg
        run: |
          set -euo pipefail
          cat docs/images/_dup_parts/part_*.txt > docs/images/duplicate.svg
          expected=40c533a009f6024dfe017427b6b027f0
          actual=$(md5sum docs/images/duplicate.svg | awk '{print $1}')
          test "$actual" = "$expected"
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/duplicate.svg
          git diff --cached --quiet && exit 0
          git commit -m "Assemble docs/images/duplicate.svg from parts"
          git push
