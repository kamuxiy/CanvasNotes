name: assemble-overview
on:
  push:
    paths:
      - 'docs/images/_ov_parts/**'
      - '.github/workflows/assemble-overview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble overview.svg
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          text = ''.join(Path(f'docs/images/_ov_parts/part_{i:02d}.txt').read_text() for i in range(10))
          expected = '28558aa58fe32de850d5761a680b0fd8'
          if hashlib.md5(text.encode()).hexdigest() != expected:
              # Repair known MCP transcription: 'fix' -> 'LS' in part_09
              text = text.replace('hzLS50Xm', 'hzfix50Xm', 1)
          actual = hashlib.md5(text.encode()).hexdigest()
          print('md5', actual, 'len', len(text))
          assert actual == expected, (actual, expected)
          Path('docs/images/overview.svg').write_text(text)
          PY
      - name: Commit overview.svg
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/overview.svg
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Assemble docs/images/overview.svg from parts"
          git push
