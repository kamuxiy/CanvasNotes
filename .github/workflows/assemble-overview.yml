name: assemble-overview
on:
  push:
    paths:
      - 'docs/images/_ov_parts/**'
      - '.github/workflows/assemble-overview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble overview.svg
        run: |
          set -euo pipefail
          cat docs/images/_ov_parts/part_*.txt > docs/images/overview.svg
          echo -n "md5 " && md5sum docs/images/overview.svg
          expected=28558aa58fe32de850d5761a680b0fd8
          actual=$(md5sum docs/images/overview.svg | awk '{print $1}')
          test "$actual" = "$expected"
      - name: Commit overview.svg
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/overview.svg
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Assemble docs/images/overview.svg from parts"
          git push
