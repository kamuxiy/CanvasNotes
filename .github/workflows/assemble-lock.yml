name: assemble-lock
on:
  push:
    paths:
      - '.github/workflows/assemble-lock.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify package-lock.json
        run: |
          set -euo pipefail
          curl -fsSL -o package-lock.json https://litter.catbox.moe/07hmnf.json
          expected=1d84ba76b3c1fd70d166bbdc6ed5e761
          actual=$(md5sum package-lock.json | awk '{print $1}')
          echo "md5 $actual"
          test "$actual" = "$expected"
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Add package-lock.json"
          git push
