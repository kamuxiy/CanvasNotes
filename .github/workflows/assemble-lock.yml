name: assemble-lock
on:
  push:
    paths:
      - 'docs/images/_lock_parts/**'
      - '.github/workflows/assemble-lock.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble package-lock.json
        run: |
          set -euo pipefail
          cat docs/images/_lock_parts/part_*.txt > package-lock.json
          expected=1d84ba76b3c1fd70d166bbdc6ed5e761
          actual=$(md5sum package-lock.json | awk '{print $1}')
          test "$actual" = "$expected"
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Assemble package-lock.json from parts"
          git push
