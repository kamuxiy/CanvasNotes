name: assemble-lock
on:
  push:
    paths:
      - 'docs/images/_lock_b64/**'
      - '.github/workflows/assemble-lock.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble package-lock.json
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64, hashlib
          b64 = ''.join(Path(f'docs/images/_lock_b64/part_{i:02d}.b64').read_text().strip() for i in range(40))
          data = base64.b64decode(b64)
          expected = '1d84ba76b3c1fd70d166bbdc6ed5e761'
          actual = hashlib.md5(data).hexdigest()
          print('md5', actual, 'len', len(data))
          assert actual == expected
          Path('package-lock.json').write_bytes(data)
          PY
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Assemble package-lock.json from b64 parts"
          git push
