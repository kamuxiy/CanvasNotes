name: Build Windows Client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建完成后发布到 GitHub Releases'
        type: boolean
        default: true
      tag_name:
        description: 'Release 标签名（留空则使用 package.json 的 version，加 v 前缀）'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ inputs.tag_name }}"
            if [ -n "$INPUT" ]; then
              TAG="$INPUT"
            else
              TAG="v${PKG_VERSION}"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "pkg_version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved package.json=${PKG_VERSION} release_tag=${TAG}"

      - name: Install
        run: npm install

      - name: Build Windows EXE
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canvas-notes-windows
          path: release/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: 画布笔记 ${{ steps.meta.outputs.tag_name }}
          files: release/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
