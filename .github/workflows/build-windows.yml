name: Build Windows Client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reconstruct package-lock.json
        run: |
          node -e "const fs=require('fs');const zlib=require('zlib');let b64=[...Array(17)].map((_,i)=>fs.readFileSync('.github/lock-b64/p'+String(i).padStart(2,'0')+'.txt','utf8')).join('').replace(/\s+/g,'');b64=b64.replace('APo9fjkcrGeBfF','APo9fhkcrGeBfF').replace('lqTTqs/JC7vVM','lqTTqrt/JC7vVM');fs.writeFileSync('package-lock.json', zlib.gunzipSync(Buffer.from(b64,'base64')));console.log('lock bytes', fs.statSync('package-lock.json').size);"

      - name: Install
        run: npm ci

      - name: Build Windows EXE
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canvas-notes-windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
